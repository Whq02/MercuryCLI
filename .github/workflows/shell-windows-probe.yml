# ============================================================================
#  .github/workflows/shell-windows-probe.yml — the Windows road for the shell
#  on a real windows-latest runner: the shell engine BUILT natively (cargo,
#  the MSVC target — upstream publishes no Windows binary at the pinned
#  version), the engine's smoke, and the bundle booting with bash.exe present,
#  with bash.exe ABSENT (the Bash tool leaves the roster; the doctor row and
#  the notice name the fix), and with a MERCURY_GIT_BASH_PATH that points
#  nowhere (the one loud refusal that stays).
#
#  DISPATCH-ONLY, EXACT-SHA: `gh workflow run shell-windows-probe.yml
#  -f sha=<sha>`. No push trigger, ever (the gate.yml quota rule).
# ============================================================================
name: shell-windows-probe

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to probe (required)'
        required: true
      brush_version:
        description: 'The shell engine version to build (crates.io brush-shell)'
        required: false
        default: '0.4.0'

concurrency:
  group: shell-windows-probe
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRUSH_VERSION: ${{ inputs.brush_version || '0.4.0' }}
  MERCURY_CREDENTIAL_STORE: file
  MERCURY_OPERATOR: sam

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}

      - name: Assert exact-SHA checkout
        run: |
          $head = git rev-parse HEAD
          if ($head -ne "${{ inputs.sha }}") { throw "checkout $head != requested ${{ inputs.sha }}" }

      - name: Node (runtime policy pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Bun (build runtime)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-brush-${{ runner.os }}-${{ env.BRUSH_VERSION }}

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-shell-probe-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # THE SCOUT'S CLAIM, ON THE BOX: the engine builds natively for the
      # MSVC target from the published crate at the pinned version.
      - name: Build the shell engine natively (cargo, MSVC target)
        run: |
          rustc -vV
          cargo install --locked brush-shell --version $env:BRUSH_VERSION --root "$env:RUNNER_TEMP\brush"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $brush = "$env:RUNNER_TEMP\brush\bin\brush.exe"
          & $brush --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "BRUSH_EXE=$brush" >> $env:GITHUB_ENV

      - name: Engine smoke (builtins · a pipeline · exit codes · externals · the known holes)
        run: |
          $brush = $env:BRUSH_EXE
          Write-Host '== variables, functions, arithmetic, tests'
          & $brush -c 'x=41; f() { echo "f sees $((x+1))"; }; f; [[ -n $x ]] && echo ok-test'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host '== a pipeline over utilities'
          & $brush -c 'printf "b\na\nc\n" | sort | head -n 2 | tr a-z A-Z'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host '== exit codes 0 / 1 / 127'
          & $brush -c 'true'; Write-Host "true -> $LASTEXITCODE"
          & $brush -c 'false'; Write-Host "false -> $LASTEXITCODE"
          & $brush -c 'no-such-command-xyz'; Write-Host "missing command -> $LASTEXITCODE"
          Write-Host '== an external .exe and the cwd after cd'
          & $brush -c 'node --version && cd "$RUNNER_TEMP" && pwd'
          Write-Host "node + cd -> $LASTEXITCODE"
          Write-Host '== EVIDENCE ONLY (upstream issues 1317 and 1251 at 0.4.0): a .cmd shim, a relative path after cd'
          & $brush -c 'npm --version'; Write-Host "npm (a .cmd shim) -> $LASTEXITCODE"
          & $brush -c 'cd "$RUNNER_TEMP" && ./brush/bin/brush.exe --version'; Write-Host "relative path after cd -> $LASTEXITCODE"
          exit 0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache vendor fetches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-shell-probe-${{ runner.os }}-${{ hashFiles('vendor/*.lock.json') }}

      - name: Fetch pinned vendor artifacts (hash-verified)
        run: |
          bun run scripts/vendor/fetch-pyright.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-debugpy.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-js-debug.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-grammars.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-node.ts --platform win-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Lay the engine pack (vendor/brush/win-x64) when the tree carries the pack script
        run: |
          if (Test-Path scripts/vendor/build-brush.ts) {
            bun run scripts/vendor/build-brush.ts
            Write-Host "build-brush -> $LASTEXITCODE"
            if (Test-Path vendor/brush) { Get-ChildItem -Recurse vendor/brush | Select-Object FullName, Length | Format-Table -AutoSize }
          } else {
            Write-Host 'no scripts/vendor/build-brush.ts on this tree - the pack layout leg is skipped (the native build above is the evidence)'
          }
          exit 0

      - name: Build dist
        run: bun run build.ts

      - name: Windows pack layout prover
        run: bun scripts/bash/prove-shell-windows-pack-layout.ts

      - name: Windows shell road prover (the seam legs + the bundle)
        run: bun scripts/bash/prove-windows-shell-road.ts

      - name: Doctor with bash.exe PRESENT
        run: |
          $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-present"
          node dist\mercury.mjs doctor --json > "$env:RUNNER_TEMP\doctor-present.json"
          $code = $LASTEXITCODE
          Write-Host "doctor -> $code"
          $d = Get-Content "$env:RUNNER_TEMP\doctor-present.json" -Raw | ConvertFrom-Json
          Write-Host "verdict: $($d.verdict)"
          $d.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' } | Format-List
          $d.readiness | Where-Object { $_.id -eq 'tool:shell' } | Format-List
          "DOCTOR_PRESENT_EXIT=$code" >> $env:GITHUB_ENV

      # THE ROAD ON THE REAL BOX: bash.exe renamed away and the Git
      # directories off PATH — Mercury boots, the shell check warns with the
      # fix, the readiness row reads unavailable. Restored in the finally.
      - name: Doctor with bash.exe ABSENT (the real road)
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "no $bash on this runner - the absent leg needs the classic install" }
          Rename-Item -Path $bash -NewName 'bash.exe.off'
          try {
            $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'Git' }) -join ';'
            $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-absent"
            Write-Host '== --version boots'
            node dist\mercury.mjs --version
            Write-Host "version -> $LASTEXITCODE"
            Write-Host '== doctor --json'
            node dist\mercury.mjs doctor --json > "$env:RUNNER_TEMP\doctor-absent.json"
            $code = $LASTEXITCODE
            Write-Host "doctor -> $code (present run: $env:DOCTOR_PRESENT_EXIT)"
            $d = Get-Content "$env:RUNNER_TEMP\doctor-absent.json" -Raw | ConvertFrom-Json
            Write-Host "verdict: $($d.verdict)"
            $shell = $d.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' }
            $shell | Format-List
            $row = $d.readiness | Where-Object { $_.id -eq 'tool:shell' }
            $row | Format-List
            if ($shell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DID NOT WARN'; exit 1 }
            if ($row.state -ne 'unavailable') { Write-Host 'THE READINESS ROW DID NOT READ unavailable'; exit 1 }
            if ("$code" -ne "$env:DOCTOR_PRESENT_EXIT") { Write-Host 'THE EXIT CODE MOVED WITHOUT bash.exe'; exit 1 }
          } finally {
            Rename-Item -Path "$bash.off" -NewName 'bash.exe'
          }

      - name: A MERCURY_GIT_BASH_PATH that points nowhere still refuses loud
        run: |
          $env:MERCURY_GIT_BASH_PATH = 'C:\nowhere\bash.exe'
          $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-pin"
          node dist\mercury.mjs doctor --json 2> "$env:RUNNER_TEMP\pin.err" | Out-Null
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\pin.err"
          if ($code -ne 1) { Write-Host "expected exit 1, got $code"; exit 1 }

      - name: Engine session prover (when the engine landed on this tree)
        env:
          MERCURY_SHELL_ENGINE: brush
        run: |
          if (Test-Path scripts/bash/prove-shell-engine-session.ts) {
            bun scripts/bash/prove-shell-engine-session.ts
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host 'no scripts/bash/prove-shell-engine-session.ts on this tree - skipped'
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: shell-windows-probe-${{ inputs.sha }}
          path: |
            ${{ runner.temp }}/doctor-present.json
            ${{ runner.temp }}/doctor-absent.json
            ${{ runner.temp }}/pin.err
          if-no-files-found: warn
