name: shell-windows-probe

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to probe (required)'
        required: true
      brush_version:
        description: 'The shell engine version to build (crates.io brush-shell)'
        required: false
        default: '0.4.0'

concurrency:
  group: shell-windows-probe
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRUSH_VERSION: ${{ inputs.brush_version || '0.4.0' }}
  MERCURY_CREDENTIAL_STORE: file
  MERCURY_OPERATOR: sam

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}

      - name: Assert exact-SHA checkout
        run: |
          $head = git rev-parse HEAD
          if ($head -ne "${{ inputs.sha }}") { throw "checkout $head != requested ${{ inputs.sha }}" }

      - name: Node (runtime policy pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Bun (build runtime)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-brush-${{ runner.os }}-${{ env.BRUSH_VERSION }}

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-shell-probe-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build the shell engine natively (cargo, MSVC target)
        run: |
          rustc -vV
          cargo install --locked brush-shell --version $env:BRUSH_VERSION --root "$env:RUNNER_TEMP\brush"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $brush = "$env:RUNNER_TEMP\brush\bin\brush.exe"
          & $brush --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "BRUSH_EXE=$brush" >> $env:GITHUB_ENV

      - name: Engine smoke (builtins · a pipeline · exit codes · externals · the known holes)
        run: |
          $brush = $env:BRUSH_EXE
          Write-Host '== variables, functions, arithmetic, tests'
          & $brush -c 'x=41; f() { echo "f sees $((x+1))"; }; f; [[ -n $x ]] && echo ok-test'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host '== a pipeline over utilities'
          & $brush -c 'printf "b\na\nc\n" | sort | head -n 2 | tr a-z A-Z'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host '== exit codes 0 / 1 / 127'
          & $brush -c 'true'; Write-Host "true -> $LASTEXITCODE"
          & $brush -c 'false'; Write-Host "false -> $LASTEXITCODE"
          & $brush -c 'no-such-command-xyz'; Write-Host "missing command -> $LASTEXITCODE"
          Write-Host '== an external .exe and the cwd after cd'
          & $brush -c 'node --version && cd "$RUNNER_TEMP" && pwd'
          Write-Host "node + cd -> $LASTEXITCODE"
          Write-Host '== EVIDENCE ONLY (upstream issues 1317 and 1251 at 0.4.0): a .cmd shim, a relative path after cd'
          & $brush -c 'npm --version'; Write-Host "npm (a .cmd shim) -> $LASTEXITCODE"
          & $brush -c 'cd "$RUNNER_TEMP" && ./brush/bin/brush.exe --version'; Write-Host "relative path after cd -> $LASTEXITCODE"
          exit 0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache vendor fetches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-shell-probe-${{ runner.os }}-${{ hashFiles('vendor/*.lock.json') }}

      - name: Fetch pinned vendor artifacts (hash-verified)
        run: |
          bun run scripts/vendor/fetch-pyright.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-debugpy.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-js-debug.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-grammars.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-node.ts --platform win-x64
          bun run scripts/vendor/fetch-python.ts --platform win-x64
          bun run scripts/vendor/fetch-pdfjs.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bun run scripts/vendor/fetch-json-query.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Lay the engine pack (vendor/brush/win-x64) when the tree carries the pack script
        run: |
          if (Test-Path scripts/vendor/build-brush.ts) {
            bun run scripts/vendor/build-brush.ts
            Write-Host "build-brush -> $LASTEXITCODE"
            if (Test-Path vendor/brush) { Get-ChildItem -Recurse vendor/brush | Select-Object FullName, Length | Format-Table -AutoSize }
          } else {
            Write-Host 'no scripts/vendor/build-brush.ts on this tree - the pack layout leg is skipped (the native build above is the evidence)'
          }
          exit 0

      - name: Lay the bash pack (vendor/bash/win-x64) from the pinned MSYS2 packages when the tree carries the fetch
        run: |
          if (Test-Path scripts/vendor/fetch-bash-win.ts) {
            bun run scripts/vendor/fetch-bash-win.ts
            if ($LASTEXITCODE -ne 0) { Write-Host 'THE BASH PACK WAS NOT LAID OUT'; exit 1 }
            bun run scripts/vendor/fetch-bash-win.ts --check
            if ($LASTEXITCODE -ne 0) { Write-Host 'THE LAID OUT BASH PACK DOES NOT PASS ITS OWN CHECK'; exit 1 }
            & vendor\bash\win-x64\usr\bin\bash.exe --norc --noprofile -c 'printf "%s\n" "$BASH_VERSION"'
            Write-Host "the pack's bash -> $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { Write-Host 'THE BASH OF THE PACK DOES NOT START ON THIS RUNNER'; exit 1 }
          } else {
            Write-Host 'no scripts/vendor/fetch-bash-win.ts on this tree - the bash pack legs below read a build without it'
          }
          exit 0

      - name: Build dist
        run: bun run build.ts

      - name: Health with bash.exe PRESENT
        run: |
          $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-present"
          node dist\mercury.mjs health --json > "$env:RUNNER_TEMP\health-present.json"
          $code = $LASTEXITCODE
          Write-Host "health -> $code"
          $d = Get-Content "$env:RUNNER_TEMP\health-present.json" -Raw | ConvertFrom-Json
          Write-Host "verdict: $($d.verdict)"
          $failing = @($d.sections | ForEach-Object { $_.checks } | Where-Object { $_.status -eq 'fail' } | ForEach-Object { $_.id })
          Write-Host "failing checks (this runner's own, not the road's): $($failing -join ', ')"
          $shell = $d.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' }
          $shell | Format-List
          $row = $d.readiness | Where-Object { $_.id -eq 'tool:shell' }
          $row | Format-List
          if ($shell.status -ne 'ok') { Write-Host 'THE SHELL CHECK IS NOT ok WITH bash.exe PRESENT'; exit 1 }
          if ($row.state -ne 'ready') { Write-Host 'THE READINESS ROW IS NOT ready WITH bash.exe PRESENT'; exit 1 }
          if ((Get-Content dist\manifest.json -Raw | ConvertFrom-Json).bash.vendored -eq $true) {
            if ($shell.evidence -notmatch '^bash 5\.') { Write-Host 'THE SHELL CHECK DOES NOT NAME THE VERSION OF THE BASH IT FOUND'; exit 1 }
            if ($shell.evidence -notmatch 'found on this machine') { Write-Host 'THE SHELL CHECK DOES NOT SAY THE INSTALLED BASH SERVES BEFORE THE ONE MERCURY SHIPS'; exit 1 }
          }
          "HEALTH_PRESENT_EXIT=$code" >> $env:GITHUB_ENV
          "HEALTH_PRESENT_FAILING=$($failing -join ',')" >> $env:GITHUB_ENV
          exit 0

      - name: Health with bash.exe ABSENT (the real road)
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "no $bash on this runner - the absent leg needs the classic install" }
          Rename-Item -Path $bash -NewName 'bash.exe.off'
          $verdict = 0
          try {
            $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-absent"
            Write-Host '== --version boots'
            node dist\mercury.mjs --version
            $versionCode = $LASTEXITCODE
            Write-Host "version -> $versionCode"
            Write-Host '== health --json'
            node dist\mercury.mjs health --json > "$env:RUNNER_TEMP\health-absent.json"
            $code = $LASTEXITCODE
            Write-Host "health -> $code (present run: $env:HEALTH_PRESENT_EXIT)"
            $d = Get-Content "$env:RUNNER_TEMP\health-absent.json" -Raw | ConvertFrom-Json
            Write-Host "verdict: $($d.verdict)"
            $failing = @($d.sections | ForEach-Object { $_.checks } | Where-Object { $_.status -eq 'fail' } | ForEach-Object { $_.id })
            Write-Host "failing checks: $($failing -join ', ') (present run: $env:HEALTH_PRESENT_FAILING)"
            $shell = $d.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' }
            $shell | Format-List
            $row = $d.readiness | Where-Object { $_.id -eq 'tool:shell' }
            $row | Format-List
            if ($versionCode -ne 0) { Write-Host '--version DID NOT EXIT 0 WITHOUT bash.exe'; $verdict = 1 }
            $built = Get-Content dist\manifest.json -Raw | ConvertFrom-Json
            $bashPacked = $built.bash.vendored -eq $true
            $packed = $built.shellEngine.vendored -eq $true
            Write-Host "bash pack in dist: $bashPacked; shell engine pack in dist: $packed"
            if ($bashPacked) {
              if ($shell.status -ne 'ok') { Write-Host 'THE SHELL CHECK IS NOT ok ON THE BASH MERCURY SHIPS'; $verdict = 1 }
              if ($shell.evidence -notmatch '^bash 5\.') { Write-Host 'THE SHELL CHECK DOES NOT NAME A BASH 5'; $verdict = 1 }
              if ($shell.evidence -notmatch 'the bash Mercury ships') { Write-Host 'THE SHELL CHECK DOES NOT NAME THE BASH MERCURY SHIPS'; $verdict = 1 }
              if ($row.state -ne 'ready') { Write-Host 'THE READINESS ROW IS NOT ready ON THE BASH MERCURY SHIPS'; $verdict = 1 }
            } elseif ($packed) {
              if ($shell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DOES NOT WARN ON THE BUNDLED ENGINE, THE LAST ROAD'; $verdict = 1 }
              if ($shell.evidence -notmatch 'bundled shell engine') { Write-Host 'THE SHELL CHECK DOES NOT NAME THE BUNDLED ENGINE'; $verdict = 1 }
              if ($row.state -ne 'ready') { Write-Host 'THE READINESS ROW IS NOT ready ON THE BUNDLED ENGINE'; $verdict = 1 }
            } else {
              if ($shell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DID NOT WARN'; $verdict = 1 }
              if ($row.state -ne 'unavailable') { Write-Host 'THE READINESS ROW DID NOT READ unavailable'; $verdict = 1 }
            }
            if ("$code" -ne "$env:HEALTH_PRESENT_EXIT") { Write-Host 'THE EXIT CODE MOVED WITHOUT bash.exe'; $verdict = 1 }
            Write-Host '== health --json with the engine forced off (MERCURY_SHELL_ENGINE=system)'
            $env:MERCURY_SHELL_ENGINE = 'system'
            $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-absent-off"
            node dist\mercury.mjs health --json > "$env:RUNNER_TEMP\health-absent-off.json"
            $offCode = $LASTEXITCODE
            Remove-Item Env:MERCURY_SHELL_ENGINE
            $off = Get-Content "$env:RUNNER_TEMP\health-absent-off.json" -Raw | ConvertFrom-Json
            $offShell = $off.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' }
            $offShell | Format-List
            $offRow = $off.readiness | Where-Object { $_.id -eq 'tool:shell' }
            $offRow | Format-List
            if ($bashPacked) {
              if ($offShell.status -ne 'ok') { Write-Host 'THE SHELL CHECK IS NOT ok ON THE BASH MERCURY SHIPS WITH THE ENGINE FORCED OFF'; $verdict = 1 }
              if ($offShell.evidence -notmatch 'the bash Mercury ships') { Write-Host 'THE SYSTEM PIN DID NOT KEEP THE BASH MERCURY SHIPS'; $verdict = 1 }
              if ($offRow.state -ne 'ready') { Write-Host 'THE READINESS ROW IS NOT ready ON THE BASH MERCURY SHIPS WITH THE ENGINE FORCED OFF'; $verdict = 1 }
            } else {
              if ($offShell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DID NOT WARN WITH THE ENGINE FORCED OFF'; $verdict = 1 }
              if ($offRow.state -ne 'unavailable') { Write-Host 'THE READINESS ROW DID NOT READ unavailable WITH THE ENGINE FORCED OFF'; $verdict = 1 }
            }
            if ("$offCode" -ne "$env:HEALTH_PRESENT_EXIT") { Write-Host 'THE EXIT CODE MOVED WITH THE ENGINE FORCED OFF'; $verdict = 1 }
            if ($bashPacked) {
              Write-Host '== health --json with the bash pack moved away too: out of dist and out of the checkout, which the bundle also reads'
              Rename-Item -Path 'dist\vendor\bash' -NewName 'bash.off'
              Rename-Item -Path 'vendor\bash' -NewName 'bash.off'
              try {
                $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-absent-bare"
                node dist\mercury.mjs health --json > "$env:RUNNER_TEMP\health-absent-bare.json"
                $bareCode = $LASTEXITCODE
                $bare = Get-Content "$env:RUNNER_TEMP\health-absent-bare.json" -Raw | ConvertFrom-Json
                $bareShell = $bare.sections | ForEach-Object { $_.checks } | Where-Object { $_.id -eq 'shell' }
                $bareShell | Format-List
                $bareRow = $bare.readiness | Where-Object { $_.id -eq 'tool:shell' }
                $bareRow | Format-List
                if ($packed) {
                  if ($bareShell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DOES NOT WARN ON THE BUNDLED ENGINE, THE LAST ROAD'; $verdict = 1 }
                  if ($bareShell.evidence -notmatch 'bundled shell engine') { Write-Host 'THE SHELL CHECK DOES NOT NAME THE BUNDLED ENGINE WITH NO BASH OF ANY ORIGIN'; $verdict = 1 }
                  if ($bareRow.state -ne 'ready') { Write-Host 'THE READINESS ROW IS NOT ready ON THE BUNDLED ENGINE'; $verdict = 1 }
                } else {
                  if ($bareShell.status -ne 'warn') { Write-Host 'THE SHELL CHECK DID NOT WARN WITH NO SHELL AT ALL'; $verdict = 1 }
                  if ($bareRow.state -ne 'unavailable') { Write-Host 'THE READINESS ROW DID NOT READ unavailable WITH NO SHELL AT ALL'; $verdict = 1 }
                }
                if ("$bareCode" -ne "$env:HEALTH_PRESENT_EXIT") { Write-Host 'THE EXIT CODE MOVED WITH THE BASH PACK AWAY'; $verdict = 1 }
              } finally {
                Rename-Item -Path 'vendor\bash.off' -NewName 'bash'
                Rename-Item -Path 'dist\vendor\bash.off' -NewName 'bash'
              }
            }
          } finally {
            Rename-Item -Path "$bash.off" -NewName 'bash.exe'
          }
          exit $verdict

      - name: A MERCURY_GIT_BASH_PATH that points nowhere still refuses loud
        run: |
          $env:MERCURY_GIT_BASH_PATH = 'C:\nowhere\bash.exe'
          $env:MERCURY_CONFIG_DIR = "$env:RUNNER_TEMP\home-pin"
          node dist\mercury.mjs health --json 2> "$env:RUNNER_TEMP\pin.err" | Out-Null
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\pin.err"
          if ($code -ne 1) { Write-Host "expected exit 1, got $code"; exit 1 }
          exit 0

      - name: Windows shell road prover (the seam legs + the bundle)
        id: road
        continue-on-error: true
        run: bun scripts/bash/prove-windows-shell-road.ts

      - name: Windows pack layout prover
        id: layout
        continue-on-error: true
        run: bun scripts/bash/prove-shell-windows-pack-layout.ts

      - name: Bash road provers (the detector, the pack, the order of the roads, the payload contract; when they landed on this tree)
        id: bashroad
        continue-on-error: true
        run: |
          $red = 0
          foreach ($proof in 'scripts/bash/prove-windows-bash-detector.ts', 'scripts/bash/prove-bash-win-pack.ts', 'scripts/bash/prove-windows-road-order.ts', 'scripts/release/prove-windows-payload-bash-pack.ts') {
            if (Test-Path $proof) {
              bun $proof
              Write-Host "$proof -> $LASTEXITCODE"
              if ($LASTEXITCODE -ne 0) { $red = 1 }
            } else {
              Write-Host "no $proof on this tree - skipped"
            }
          }
          exit $red

      - name: Engine session prover (when the engine landed on this tree)
        id: engine
        continue-on-error: true
        env:
          MERCURY_SHELL_ENGINE: brush
        run: |
          if (Test-Path scripts/bash/prove-shell-engine-session.ts) {
            bun scripts/bash/prove-shell-engine-session.ts
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host 'no scripts/bash/prove-shell-engine-session.ts on this tree - skipped'
          }

      - name: Probe verdict (every prover's outcome, one line each)
        if: always()
        run: |
          $outcomes = @{
            'road prover'   = '${{ steps.road.outcome }}'
            'layout prover' = '${{ steps.layout.outcome }}'
            'bash provers'  = '${{ steps.bashroad.outcome }}'
            'engine prover' = '${{ steps.engine.outcome }}'
          }
          $red = 0
          foreach ($k in $outcomes.Keys | Sort-Object) {
            Write-Host ("{0,-14} {1}" -f $k, $outcomes[$k])
            if ($outcomes[$k] -eq 'failure') { $red = 1 }
          }
          if ($red -eq 1) { Write-Host 'PROBE RED: at least one prover failed (its log is above, whole)'; exit 1 }
          Write-Host 'PROBE GREEN'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: shell-windows-probe-${{ inputs.sha }}
          path: |
            ${{ runner.temp }}/health-present.json
            ${{ runner.temp }}/health-absent.json
            ${{ runner.temp }}/health-absent-off.json
            ${{ runner.temp }}/health-absent-bare.json
            ${{ runner.temp }}/pin.err
          if-no-files-found: warn
