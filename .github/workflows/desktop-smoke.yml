name: desktop-smoke

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact commit SHA to test (required — the ledger law)'
        required: true

concurrency:
  group: desktop-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}

      - name: Assert exact-SHA checkout
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "${{ inputs.sha }}" ]; then echo "checkout $head != requested ${{ inputs.sha }}"; exit 1; fi

      - name: Node (runtime policy pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Bun (build runtime)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Xvfb
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Build the desktop driver pack
        run: ~/.bun/bin/bun run scripts/vendor/build-desktop.ts

      - name: Desktop suite under a virtual X server (the acts allowed)
        run: xvfb-run -a -s "-screen 0 1280x800x24" env MERCURY_SUITE_DESKTOP_LIVE=acts MERCURY_CREDENTIAL_STORE=file bash scripts/desktop/run-all.sh
