[package]
name = "mercury_whisper"
version = "0.1.0"
edition = "2021"
description = "Mercury's on-device transcriber, as a Node-API module: whisper.cpp, statically linked through whisper-rs, over a 16 kHz mono take held in memory — a loaded model answers a transcript on a background thread, and nothing leaves the machine"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
whisper-rs = { version = "0.16", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
