[package]
name = "mercury_voice"
version = "0.1.0"
edition = "2021"
description = "Mercury's native addon, as a Node-API module: voice capture (input devices and 16 kHz mono capture over the platform audio layer) and the terminal hand-back (the controlling terminal's foreground process group, read and reclaimed)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
cpal = "0.18"

# The terminal hand-back (src/tty.rs) needs tcgetpgrp/tcsetpgrp/getpgrp and
# sigaction — POSIX only, so the dependency is too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
